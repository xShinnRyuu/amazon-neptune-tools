name: Neo4j-to-Neptune CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'neo4j-to-neptune/**'
    branches:
      - master
  push:
    paths:
      - 'neo4j-to-neptune/**'
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'corretto'

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('neo4j-to-neptune/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Run Maven build and tests with code coverage
      working-directory: ./neo4j-to-neptune
      run: mvn clean verify jacoco:report --batch-mode --fail-at-end

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: neo4j-to-neptune/target/surefire-reports/

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./neo4j-to-neptune/target/site/jacoco/jacoco.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Generate coverage report comment
      uses: madrapps/jacoco-report@v1.7.1
      if: github.event_name == 'pull_request'
      with:
        paths: ./neo4j-to-neptune/target/site/jacoco/jacoco.xml
        token: ${{ secrets.GITHUB_TOKEN }}
        min-coverage-overall: 70
        min-coverage-changed-files: 80
